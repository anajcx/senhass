<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Senhas</title>
</head>
<body>
<section class="conteudo">
<div class="conteudo-titulo">
<img src="" alt="">
<h2 class="titulo-primario"> Gerador de Senhas</h2>
<h3 class="titulo-secundario">Gere instanteamente uma Senha aleatoria e segura</h3>
</div>
<div class="conteudo-senha">
<label for="Senhas"></label>
<input name="senha" type="text" id="campo-senha">
</div>
<div class="parametro">
<h3 class="parametro-titulo">Perrsonalize sua Senha</h3>
<div class="parametro-coluna_senha">
<div class="parametro-senha">
<h4 class="parametro-senha_titulo">Numero caracteres</h4>
<div class="parametro-senha_botoes">
<button class="parametro-senha_botao">-</button>
<p class="parametro-senha_texto">12</p>
<button class="parametro-senha_botao">+
</button>
</div>
</div>
<div class="parametro-senha">
<h4 class="parametro-senha_titulo">Caracteristicas da Senha</h4>
<div class="parametro-senha-checkbox">
<input name="maisculo" type="checkbox" checked>
<label for="maisculo">Letras maisculo</label>
</div>
<div class="parametro-senha-checkbox">
<input name="minusculo" type="checkbox" checked>
<label for="minusculo">Letras minusculo</label>
</div>
</div>
<div class="parametro-senha-checkbox">
<input name="numeros" type="numeros" checked>
<label for="numeros">Numeros</label>
</div>
</div>
<div class="parametro-senha-checkbox">
<input name="simbolos" type="simbolos" checked>
<label for="simbolos">simbolos</label>
</div>

</div>
<div class="parametro-senha">
    <h4 class="parametro-senha_titulo">força de senha</h4>
</div>
</section>
</body>
</html>
